<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>bad-limbo</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   bad-limbo — 8 fases
   Canvas 2D puro + Web Audio procedural. Sem arquivos externos.
   ===================================================================== */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Utilidades ----------
const VIEW_H = 500;      // altura lógica visível do mundo
const TW     = 1500;     // largura lógica dos "tiles" de parallax
let W = 1, H = 1, S = 1, viewW = 1, cssW = 1, cssH = 1, fxScale = 1;
let touchMode = false;
try { touchMode = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const mod = (a, n) => ((a % n) + n) % n;
const EPS = 1e-3;   // tolerância p/ evitar falsos contatos por erro de ponto flutuante
const overlap = (a, b) => a.x < b.x + b.w - EPS && a.x + a.w > b.x + EPS && a.y < b.y + b.h - EPS && a.y + a.h > b.y + EPS;
const ovx = (a, b) => Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Constantes de física ----------
const PW = 16, PH = 36;
const GRAV = 1700, MAXFALL = 950;
const RUN_V = 215, GRAB_V = 72, GRAB_V_HEAVY = 58, JUMP_V = 560;
const GRAB_RANGE = 10, STEP_UP = 9;

/* =====================================================================
   ÁUDIO PROCEDURAL (Web Audio API) — iniciado no primeiro toque/tecla
   ===================================================================== */
const Aud = (() => {
  let ac = null, master = null, nb = null, sawG = null, ambG = null, ambF = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      ac = new C();
      master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
      nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // zumbido contínuo das serras
      const o1 = ac.createOscillator(), o2 = ac.createOscillator();
      o1.type = 'sawtooth'; o1.frequency.value = 92; o2.type = 'square'; o2.frequency.value = 139;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
      sawG = ac.createGain(); sawG.gain.value = 0;
      o1.connect(lp); o2.connect(lp); lp.connect(sawG); sawG.connect(master);
      o1.start(); o2.start();
      // vento / rumor ambiente
      const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
      ambF = ac.createBiquadFilter(); ambF.type = 'bandpass'; ambF.frequency.value = 420; ambF.Q.value = 0.6;
      ambG = ac.createGain(); ambG.gain.value = 0.05;
      src.connect(ambF); ambF.connect(ambG); ambG.connect(master); src.start();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function noise(dur, ftype, f0, f1, q, vol, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = nb;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function tone(type, f0, f1, dur, vol, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init,
    get ready() { return !!ac; },
    step(kind) {
      if (kind === 'metal') { tone('triangle', 540 + Math.random() * 90, 280, 0.07, 0.035); noise(0.05, 'highpass', 2600, 1800, 1, 0.025); }
      else { noise(0.1, 'lowpass', 800 + Math.random() * 200, 350, 0.8, 0.07); }
    },
    land() { noise(0.14, 'lowpass', 600, 200, 0.8, 0.1); },
    trap() { tone('square', 980, 160, 0.3, 0.13); noise(0.18, 'bandpass', 3200, 900, 2, 0.22); tone('sine', 130, 55, 0.3, 0.3); },
    death() { noise(0.55, 'lowpass', 500, 70, 0.8, 0.3); tone('sine', 95, 35, 0.5, 0.35); },
    grav(on) { tone('sine', on ? 120 : 90, on ? 34 : 30, 1.0, 0.4); tone('sawtooth', on ? 62 : 52, 28, 0.9, 0.09); noise(0.7, 'lowpass', 300, 60, 0.7, 0.12); },
    click() { tone('square', 1300, 700, 0.06, 0.06); noise(0.04, 'highpass', 3000, 2000, 1, 0.05); },
    lever() { noise(0.12, 'bandpass', 900, 400, 3, 0.15); tone('square', 280, 170, 0.14, 0.07); },
    thud() { tone('sine', 85, 38, 0.28, 0.3); noise(0.2, 'lowpass', 500, 120, 0.8, 0.2); },
    creak() { tone('sawtooth', 160, 120, 0.5, 0.04); },
    sparks() { noise(0.1, 'highpass', 4500, 3000, 1, 0.05); },
    door() { tone('sawtooth', 70, 55, 0.5, 0.07); noise(0.4, 'lowpass', 400, 150, 0.8, 0.08); },
    setSaw(v) { if (ac) sawG.gain.setTargetAtTime(clamp(v, 0, 1) * 0.1, ac.currentTime, 0.08); },
    screech() { tone('sawtooth', 1100, 260, 0.75, 0.16); tone('square', 1700, 500, 0.6, 0.06); noise(0.7, 'bandpass', 2800, 900, 2, 0.18); },
    slam() { tone('sine', 75, 28, 0.4, 0.5); noise(0.3, 'lowpass', 700, 90, 0.8, 0.35); },
    splash() { noise(0.4, 'bandpass', 1400, 400, 1.2, 0.2); tone('sine', 300, 120, 0.2, 0.05); },
    bubble() { tone('sine', 380 + Math.random() * 380, 900, 0.07, 0.035); },
    whoosh() { noise(0.9, 'bandpass', 500, 1800, 0.9, 0.22); },
    silence(on) { if (!ac) return; master.gain.setTargetAtTime(on ? 0.0 : (0.7), ac.currentTime, 0.7); },
    setTheme(th) {
      if (!ac) return;
      const cfg = { clock: [210, 0.06], cavern: [120, 0.09], silent: [300, 0.0], forest: [420, 0.05], lair: [330, 0.06], swamp: [300, 0.06], storm: [850, 0.15], factory: [160, 0.07], grav: [90, 0.07] }[th] || [420, 0.05];
      ambF.frequency.setTargetAtTime(cfg[0], ac.currentTime, 0.4);
      ambG.gain.setTargetAtTime(cfg[1], ac.currentTime, 0.4);
    }
  };
})();

/* =====================================================================
   ENTRADA (teclado + toque multitouch + seletor de fase)
   ===================================================================== */
const kb = { l: false, r: false, j: false, g: false, d: false };
const keyMap = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowDown: 'd', KeyS: 'd',
  Space: 'j', ArrowUp: 'j', KeyW: 'j',
  KeyE: 'g', ShiftLeft: 'g', ShiftRight: 'g', KeyJ: 'g'
};
const pointers = new Map();
let btnJump = { x: 0, y: 0, r: 40 }, btnGrab = { x: 0, y: 0, r: 40 }, btnReset = { x: 0, y: 0, r: 18 };
let selBtns = []; for (let i = 0; i < 8; i++) selBtns.push({ x: 0, y: 0, r: 13 });

window.addEventListener('keydown', e => {
  Aud.init();
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); kb[k] = true; }
  else if (e.code === 'KeyR' && !e.repeat) requestReset();
  else if (!e.repeat && /^Digit[1-8]$/.test(e.code)) selectLevel(+e.code.slice(5) - 1);
  if (!e.repeat) anyAction();
});
window.addEventListener('keyup', e => {
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); kb[k] = false; }
});
window.addEventListener('blur', () => {
  kb.l = kb.r = kb.j = kb.g = kb.d = false; pointers.clear();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function zoneAt(x, y) {
  for (let i = 0; i < 8; i++) if (Math.hypot(x - selBtns[i].x, y - selBtns[i].y) < selBtns[i].r * 1.5) return 'sel' + i;
  if (touchMode && Math.hypot(x - btnReset.x, y - btnReset.y) < btnReset.r * 1.5) return 'reset';
  const dj = Math.hypot(x - btnJump.x, y - btnJump.y);
  const dg = Math.hypot(x - btnGrab.x, y - btnGrab.y);
  if (dj < btnJump.r * 1.3 && dj <= dg) return 'jump';
  if (dg < btnGrab.r * 1.3) return 'grab';
  if (x < cssW * 0.5) return 'move';
  return null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Aud.init();
  const isMouse = e.pointerType === 'mouse';
  if (!isMouse) touchMode = true;
  const role = zoneAt(e.clientX, e.clientY);
  if (role && role.startsWith('sel')) { if (state !== 'title') selectLevel(+role[3]); else anyAction(); return; }
  anyAction();
  if (isMouse) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (role === 'reset') { requestReset(); return; }
  if (!role) return;
  pointers.set(e.pointerId, { role, sx: e.clientX, sy: e.clientY, ax: e.clientX, x: e.clientX, y: e.clientY, moved: false });
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  p.x = e.clientX; p.y = e.clientY;
  if (p.x - p.ax > 70) p.ax = p.x - 70;
  if (p.ax - p.x > 70) p.ax = p.x + 70;
  if (Math.abs(p.x - p.sx) > 16) p.moved = true;
}, { passive: false });
const dropPointer = e => { pointers.delete(e.pointerId); };
cv.addEventListener('pointerup', dropPointer);
cv.addEventListener('pointercancel', dropPointer);
cv.addEventListener('lostpointercapture', dropPointer);

function readInput() {
  let mx = (kb.r ? 1 : 0) - (kb.l ? 1 : 0);
  let jd = kb.j, gd = kb.g, dn = kb.d;
  let tdir = 0;
  for (const p of pointers.values()) {
    if (p.role === 'jump') jd = true;
    else if (p.role === 'grab') gd = true;
    else if (p.role === 'move') {
      if (p.y - p.sy > 48) dn = true;
      if (p.moved) {
        const dx = p.x - p.ax;
        if (Math.abs(dx) > 14) tdir = dx > 0 ? 1 : -1;
      } else {
        const c = cssW * 0.25, dz = cssW * 0.035;
        tdir = p.x < c - dz ? -1 : (p.x > c + dz ? 1 : 0);
      }
    }
  }
  if (tdir !== 0) mx = tdir;
  return { mx: clamp(mx, -1, 1), jd, gd, dn };
}

/* =====================================================================
   DEFINIÇÃO DAS FASES
   ===================================================================== */
const mkBox = (x, y, kind) => {
  kind = kind || 'wood';
  return { type: 'box', x, y, w: kind === 'stone' ? 44 : 40, h: 40, vy: 0, g: 1, grounded: false, support: null,
           hx: x, hy: y, kind, heavy: kind !== 'wood', seg: 0 };
};
const mkTrap = (x, hidden) => ({ type: 'trap', x, y: 368, w: 34, h: 12, vy: 0, g: 1, grounded: false, support: null,
           hx: x, hy: 368, state: 'open', hidden: !!hidden, t: 0, heavy: false, seg: 0 });
const mkButton = (x, w, heavy, action) => ({ x, w, trig: { x, y: 364, w, h: 16 }, pressed: false, heavy: !!heavy, action, seg: 0, was: false });
function mkLevel(id, name, theme, width) {
  return { id, name, theme, width, statics: [], hazards: [], checkpoints: [], boxes: [], traps: [], saws: [],
           buttons: [], doors: [], levers: [], movers: [], switches: [], log: null, endX: 0,
           ceilY: null, treeXs: [], seed: 7 + id * 13,
           waters: [], ropes: [], vents: [], hsw: [], duckZones: [], blockers: [], webs: [], cocoons: [], spider: null, beams: [], puddles: [], finale: false };
}
// campo de espinhos (chão/fosso: dir 'up'; teto: dir 'down')
function addSpikes(lv, x, w, baseY, dir) {
  lv.hazards.push({ x, w, type: 'spikes', dir, baseY, y: dir === 'up' ? baseY - 26 : baseY, h: dir === 'up' ? 80 : 30 });
}
function segOf(lv, x) {
  let s = 0;
  for (let i = 0; i < lv.checkpoints.length; i++) if (lv.checkpoints[i].x <= x) s = i;
  return s;
}
function finishLevel(lv) {
  for (const b of lv.boxes) b.seg = segOf(lv, b.hx);
  for (const t of lv.traps) t.seg = segOf(lv, t.hx);
  for (const s of lv.saws) s.seg = segOf(lv, s.ax);
  for (const b of lv.buttons) b.seg = segOf(lv, b.x);
  for (const d of lv.doors) d.seg = segOf(lv, d.x);
  for (const l of lv.levers) l.seg = segOf(lv, l.x);
  for (const m of lv.movers) m.seg = segOf(lv, m.hx);
  if (lv.log) lv.log.seg = segOf(lv, lv.log.x);
  return lv;
}

// geometria do tronco que cai e vira rampa
function logGeom(lg) {
  const phi = 70 * Math.PI / 180, c = Math.cos(phi), s = Math.sin(phi);
  const px = lg.x + lg.w, py = 380, th = lg.w, L = lg.h;
  const A = { x: px - th * c, y: py - th * s };
  const B = { x: px - th * c + L * s, y: py - th * s - L * c };
  return { phi, px, py, A, B };
}

/* ---------------- FASE 1: A FLORESTA SOMBRIA ---------------- */
function buildForest() {
  const lv = mkLevel(0, 'A FLORESTA SOMBRIA', 'forest', 3900);
  const st = lv.statics;
  st.push({ x: -200, y: 380, w: 1650, h: 320 });                    // chão inicial
  st.push({ x: 940, y: 190, w: 270, h: 138, tunnel: true });        // tronco caído / túnel baixo
  st.push({ x: 1450, y: 400, w: 150, h: 300, pit: true });          // fundo do fosso
  st.push({ x: 1600, y: 310, w: 320, h: 390 });                     // borda alta do outro lado
  st.push({ x: 1920, y: 380, w: 1180, h: 320 });                    // chão do trecho final
  addSpikes(lv, 1450, 150, 400, 'up');
  lv.checkpoints = [
    { x: 0, sx: 60, sy: 380 }, { x: 800, sx: 810, sy: 380 }, { x: 1250, sx: 1260, sy: 380 },
    { x: 1630, sx: 1640, sy: 310 }, { x: 1960, sx: 1970, sy: 380 }
  ];
  lv.traps.push(mkTrap(600, false));      // armadilha visível (pular)
  lv.traps.push(mkTrap(1010, true));      // armadilha escondida no túnel (arrastar)
  lv.boxes.push(mkBox(1370, 340, 'wood'));
  lv.boxes.push(mkBox(2150, 336, 'stone'));
  const btn = mkButton(2450, 70, true, 'log');
  lv.buttons.push(btn);
  const lg = { x: 2700, y: 110, w: 28, h: 270, state: 'hang', t: 0, ang: 0 };
  lg.geo = logGeom(lg);
  // degraus finos que aproximam a rampa (subida automática de até 9px)
  const g = lg.geo, m = (g.A.y - g.B.y) / (g.B.x - g.A.x);
  const x0 = g.A.x - (380 - g.A.y) / m;
  lg.steps = [];
  for (let xs = x0; xs < g.B.x; xs += 16) {
    const wd = Math.min(16, g.B.x - xs);
    const top = Math.max(g.B.y, g.A.y - (xs + wd - g.A.x) * m);
    lg.steps.push({ x: xs, y: top, w: wd, h: 380 - top + 12 });
  }
  lv.log = lg;
  st.push({ x: Math.round(g.B.x), y: Math.round(g.B.y), w: 3900 - Math.round(g.B.x), h: 500, ledge: true });
  lv.endX = Math.round(g.B.x) + 380;
  lv.treeXs = [140, 330, 520, 870, 1290, 1700, 1850, 2060, 2300, 2560, 3050, 3300, 3560, 3700];
  return finishLevel(lv);
}

/* ---------------- FASE 2: A FÁBRICA ABANDONADA ---------------- */
function buildFactory() {
  const lv = mkLevel(1, 'A FÁBRICA ABANDONADA', 'factory', 3900);
  const st = lv.statics;
  st.push({ x: -200, y: 380, w: 2200, h: 320 });                    // chão até o abismo
  st.push({ x: 2560, y: 380, w: 290, h: 320 });                     // chão do outro lado
  st.push({ x: 2850, y: 400, w: 130, h: 300, shaft: true });        // fundo do poço do elevador
  st.push({ x: 2980, y: 220, w: 920, h: 500, ledge: true });        // plataforma alta da saída
  lv.checkpoints = [
    { x: 0, sx: 60, sy: 380 }, { x: 600, sx: 610, sy: 380 }, { x: 1230, sx: 1240, sy: 380 },
    { x: 1700, sx: 1710, sy: 380 }, { x: 2580, sx: 2590, sy: 380 }
  ];
  // serras em trilhos (vai-e-vem) e serra fixa
  lv.saws.push({ kind: 'rail', r: 26, ax: 700, bx: 880, y: 372, period: 3.4, phase: 0.0, x: 700, rot: 0 });
  lv.saws.push({ kind: 'rail', r: 26, ax: 1010, bx: 1190, y: 372, period: 4.0, phase: 0.45, x: 1010, rot: 0 });
  lv.saws.push({ kind: 'fixed', r: 30, ax: 1500, bx: 1500, y: 376, period: 1, phase: 0, x: 1500, rot: 0 });
  lv.boxes.push(mkBox(1800, 340, 'metal'));
  lv.levers.push({ x: 1745, y: 380, kind: 'call', on: false, ang: 0, seg: 0 });
  // plataforma suspensa controlada pela alavanca
  lv.movers.push({ kind: 'plat', w: 150, h: 14, ax: 2000, bx: 2410, speed: 85, x: 2410, y: 380, hx: 2410,
                   state: 'idleB', t: 0, called: false, dx: 0, dy: 0, seg: 0 });
  // elevador de carga (sobe com a caixa de metal)
  lv.movers.push({ kind: 'lift', w: 130, h: 14, x: 2850, y: 380, hx: 2850, y0: 380, y1: 220, speed: 46, dx: 0, dy: 0, seg: 0 });
  lv.endX = 3400;
  return finishLevel(lv);
}

/* ---------------- FASE 3: A ZONA GRAVITACIONAL ---------------- */
function buildGravity() {
  const lv = mkLevel(2, 'A ZONA GRAVITACIONAL', 'grav', 3000);
  const st = lv.statics;
  lv.ceilY = 60;
  st.push({ x: -300, y: -300, w: 3700, h: 360, ceil: true });       // teto (face inferior em y=60)
  st.push({ x: -300, y: 380, w: 1000, h: 320 });
  st.push({ x: 700, y: 440, w: 400, h: 260, pit: true });
  st.push({ x: 1100, y: 380, w: 1900, h: 320 });
  st.push({ x: 1500, y: 150, w: 60, h: 230, wall: true });          // muro alto impossível de pular
  addSpikes(lv, 700, 400, 440, 'up');
  addSpikes(lv, 880, 70, 60, 'down');
  addSpikes(lv, 1880, 80, 60, 'down');
  lv.checkpoints = [
    { x: 0, sx: 60, sy: 380 }, { x: 1130, sx: 1140, sy: 380 }, { x: 1620, sx: 1640, sy: 380 }, { x: 2200, sx: 2210, sy: 380 }
  ];
  lv.switches.push({ x: 520, cd: 0 }, { x: 1230, cd: 0 }, { x: 2040, cd: 0 });
  lv.boxes.push(mkBox(1320, 340, 'metal'));
  lv.buttons.push(mkButton(1700, 60, true, 'door'));
  lv.doors.push({ x: 2150, w: 26, h: 320, dir: 'down', closedY: 60, travel: 330, open: 0, rect: { x: 2150, y: 60, w: 26, h: 320 }, seg: 0 });
  lv.endX = 2600;
  return finishLevel(lv);
}

const LEVELS = [
  { name: 'A FLORESTA SOMBRIA', roman: 'I', build: buildForest },
  { name: 'A FÁBRICA ABANDONADA', roman: 'II', build: buildFactory },
  { name: 'A ZONA GRAVITACIONAL', roman: 'III', build: buildGravity }
];

/* =====================================================================
   FASES 4–6
   ===================================================================== */
function mk2(id, name, theme, width) {
  const lv = mkLevel(id, name, theme, width);
  lv.waters = []; lv.ropes = []; lv.vents = []; lv.hsw = []; lv.duckZones = []; lv.blockers = [];
  lv.webs = []; lv.cocoons = []; lv.spider = null;
  return lv;
}
function finish2(lv) {
  finishLevel(lv);
  for (const w of lv.waters) { w.seg = segOf(lv, w.x); w.top0 = w.top; }
  for (const r of lv.ropes) { r.seg = segOf(lv, r.ax); r.A = r.baseA; r.th = r.A * Math.sin(r.ph); r.om = 0; r.Om = Math.sqrt(900 / r.len); }

  return lv;
}

/* =====================================================================
   ESTADO E GERENCIADOR DE NÍVEIS
   ===================================================================== */
let state = 'title';          // title | play | dead | exit | end
let time = 0, simT = 0, camX = 0;
let fade = 0, titleA = 1, whiteA = 0, flashA = 0, cardT = 0;
let deadT = 0, deadKind = '', exitT = 0, endT = 0, camY = 0;
let lv = null, lvIdx = 0, cpIdx = 0, prevJump = false, prevGrab = false, gdir = 1, gSm = 1;
const P = {
  x: 60, y: 380 - PH, w: PW, h: PH, crouch: false, rope: null, ropeCd: 0, stam: 1, drown: 0, wet: null, vx: 0, vy: 0, g: 1, onGround: false, support: null, coyote: 0, jumpBuf: 0,
  dir: 1, anim: 0, walkAmt: 0, held: null, side: 1, grabLock: false, dustT: 0, stepN: 0
};
const parts = [];

function addPart(x, y, vx, vy, life, r, col, g) {
  if (parts.length > 360) parts.shift();
  parts.push({ x, y, vx, vy, t: 0, life, r, col, g: g || 0 });
}
function burst(x, y, n, col, spread, up, life) {
  for (let i = 0; i < n; i++) {
    addPart(x + (Math.random() - 0.5) * 6, y, (Math.random() - 0.5) * spread, -Math.random() * up,
            life * (0.6 + Math.random() * 0.6), 1 + Math.random() * 1.8, col, 220);
  }
}

function syncDoor(d) {
  d.rect.y = d.dir === 'down' ? d.closedY + d.open * d.travel : d.closedY - d.open * d.travel;
}
function camTarget() {
  const t = P.x + PW / 2 - viewW * 0.42 + P.dir * 40;
  return clamp(t, 0, Math.max(0, lv.width - viewW));
}
function loadLevel(i, fromWhite) {
  lvIdx = i; lv = LEVELS[i].build(); cpIdx = 0; gdir = 1; gSm = 1; simT = 0;
  parts.length = 0; deadKind = ''; state = 'play'; Aud.silence(false);
  whiteA = fromWhite ? 1 : 0; fade = fromWhite ? 0 : 1; cardT = 0; flashA = 0;
  const cp = lv.checkpoints[0];
  P.h = PH; P.crouch = false; P.rope = null; P.stam = 1; P.drown = 0;
  P.x = cp.sx; P.y = cp.sy - PH; P.vx = 0; P.vy = 0; P.g = 1; P.held = null; P.dir = 1;
  P.onGround = false; P.support = null; P.grabLock = true; P.jumpBuf = 0; P.coyote = 0;
  camX = camTarget(); camY = 0;
  if (typeof buildTiles === 'function') buildTiles();
  Aud.setTheme(lv.theme);
}
function selectLevel(i) {
  if (i < 0 || i >= LEVELS.length) return;
  Aud.init();
  titleA = Math.min(titleA, 0.999);
  loadLevel(i, false);
}
function anyAction() {
  if (state === 'title') { state = 'play'; fade = 0; cardT = 0; }
  else if (state === 'end' && endT > 3.5) { Aud.setTheme('forest'); loadLevel(0, true); }
}
function requestReset() { if (state === 'play') die('reset'); }

/* ---------- reinício apenas do trecho atual ---------- */
function resetBody(b) {
  b.x = b.hx; b.y = b.hy; b.vy = 0; b.g = 1; b.grounded = false; b.support = null;
  if (b.type === 'trap') { b.state = 'open'; b.t = 0; }
  if (P.held === b) P.held = null;
}
function resetSeg(seg) {
  for (const b of lv.boxes) { b.g = 1; if (b.seg >= seg) resetBody(b); }
  for (const t of lv.traps) if (t.seg >= seg) resetBody(t);
  for (const d of lv.doors) if (d.seg >= seg) { d.open = 0; syncDoor(d); }
  for (const l of lv.levers) if (l.seg >= seg) { l.on = false; l.ang = 0; }
  for (const b of lv.buttons) if (b.seg >= seg) b.pressed = false;
  for (const m of lv.movers) if (m.seg >= seg) {
    m.x = m.hx; m.state = 'idleB'; m.called = false; m.t = 0; m.dx = m.dy = 0; m.load = 0;
    if (m.kind === 'lift') m.y = m.y0; else m.y = 380;
  }
  const lg = lv.log;
  if (lg && lg.seg >= seg) { lg.state = 'hang'; lg.t = 0; lg.ang = 0; }
  mechReset(seg);
}
function respawn() {
  const cp = lv.checkpoints[cpIdx];
  gdir = 1; gSm = 1; P.g = 1;
  resetSeg(cpIdx);
  P.h = PH; P.crouch = false; P.rope = null; P.stam = 1; P.drown = 0;
  P.x = cp.sx; P.y = cp.sy - PH; P.vx = 0; P.vy = 0; P.onGround = false; P.support = null;
  P.dir = 1; P.held = null; P.grabLock = true; P.jumpBuf = 0; P.coyote = 0;
  const r = { x: P.x - 8, y: P.y - 6, w: PW + 16, h: PH + 12 };
  for (const b of lv.boxes) if (overlap(r, b)) resetBody(b);
  for (const t of lv.traps) if (overlap(r, t)) resetBody(t);
  state = 'play';
  camX = camTarget();
}
function die(kind) {
  if (state !== 'play') return;
  state = 'dead'; deadT = 0; deadKind = kind;
  P.held = null; P.vx = 0; P.vy = 0;
  if (kind !== 'reset') Aud.death();
  const cx = P.x + PW / 2, cy = P.y + PH / 2;
  if (kind === 'spikes') burst(cx, cy, 12, 'rgb(25,25,25)', 90, 120, 0.8);
  else if (kind === 'saw' || kind === 'trap' || kind === 'spider' || kind === 'elec') burst(cx, cy, 16, 'rgb(20,20,20)', 160, 160, 0.9);
}

/* =====================================================================
   COLISÃO
   ===================================================================== */
function solidsFor(self) {
  const o = lv.statics.slice();
  for (const d of lv.doors) o.push(d.rect);
  for (const m of lv.movers) o.push(m);
  const lg = lv.log;
  if (lg) { if (lg.state === 'hang') o.push(lg); else if (lg.state === 'down') for (const s of lg.steps) o.push(s); }
  if (lv.blockers) for (const k of lv.blockers) if (k.on) o.push(k);
  for (const b of lv.boxes) if (b !== self && !b.dead) o.push(b);
  return o;
}
const blockedAt = (x, y, sol, h) => {
  const r = { x, y, w: PW, h: h || P.h };
  for (const s of sol) if (overlap(r, s)) return true;
  return false;
};
function movePlayerX(dx) {
  if (dx === 0) return;
  if (P.held) {
    const b = P.held, sol = solidsFor(b);
    const tb = { x: b.x + dx, y: b.y, w: b.w, h: b.h };
    for (const s of sol) if (overlap(tb, s)) { P.vx = 0; return; }
    const tp = { x: P.x + dx, y: P.y, w: PW, h: P.h };
    for (const s of sol) if (overlap(tp, s)) { P.vx = 0; return; }
    b.x += dx; P.x += dx;
    return;
  }
  const sol = solidsFor(null);
  P.x += dx;
  for (const s of sol) {
    if (overlap(P, s)) {
      const lift = P.g > 0 ? (P.y + P.h) - s.y : (s.y + s.h) - P.y;
      if (P.onGround && lift > 0 && lift <= STEP_UP) {
        const ny = P.g > 0 ? s.y - P.h : s.y + s.h;
        if (!blockedAt(P.x, ny, sol)) { P.y = ny; continue; }
      }
      if (dx > 0) P.x = s.x - PW; else P.x = s.x + s.w;
      P.vx = 0;
    }
  }
}
function pickSupport(r, gd, sol) {
  const edge = gd > 0 ? r.y + r.h : r.y;
  let best = null;
  for (const s of sol) {
    const top = gd > 0 ? s.y : s.y + s.h;
    if (Math.abs(top - edge) < 0.8 && r.x < s.x + s.w - 1 && r.x + r.w > s.x + 1) {
      if (s.kind === 'plat' || s.kind === 'lift') return s;
      if (!best) best = s;
    }
  }
  return best;
}
function movePlayerY(dy) {
  const sol = solidsFor(null);
  P.y += dy; P.onGround = false; P.support = null;
  for (const s of sol) {
    if (overlap(P, s)) {
      if (dy * P.g > 0) { P.y = P.g > 0 ? s.y - P.h : s.y + s.h; P.vy = 0; P.onGround = true; P.support = s; }
      else if (dy * P.g < 0) { P.y = P.g > 0 ? s.y + s.h : s.y - P.h; P.vy = 0; }
    }
  }
  if (P.onGround) P.support = pickSupport(P, P.g, sol) || P.support;
}

/* ---------- agarrar / alavancas / interruptores ---------- */
function bodies() { return lv.boxes.filter(b => !b.dead).concat(lv.traps.filter(t => !t.gone)); }
const vOver = (b) => Math.min(P.y + P.h, b.y + b.h) - Math.max(P.y, b.y);
function tryGrab() {
  let best = null, side = 0, bd = 1e9;
  for (const b of bodies()) {
    if (!b.grounded || vOver(b) < 6) continue;
    const gapR = b.x - (P.x + PW), gapL = P.x - (b.x + b.w);
    if (gapR >= -1 && gapR <= GRAB_RANGE && gapR < bd) { best = b; side = 1; bd = gapR; }
    else if (gapL >= -1 && gapL <= GRAB_RANGE && gapL < bd) { best = b; side = -1; bd = gapL; }
  }
  if (best) {
    P.held = best; P.side = side; P.dir = side;
    P.x = side === 1 ? best.x - PW : best.x + best.w;
  }
}
function validateGrab() {
  const b = P.held;
  const gap = P.side === 1 ? b.x - (P.x + PW) : P.x - (b.x + b.w);
  if (Math.abs(gap) > 3 || !b.grounded || !P.onGround || vOver(b) < 4) P.held = null;
}
function flipGravity(sw) {
  gdir = -gdir; P.g = gdir; P.vy = 0; P.held = null; P.onGround = false;
  for (const b of lv.boxes) { b.g = gdir; b.vy = 0; b.grounded = false; b.support = null; }
  if (sw) sw.cd = 0.7;
  flashA = 0.4; Aud.grav(gdir < 0);

/* =====================================================================
   CORPOS FÍSICOS (caixas, pedra, armadilhas), PLATAFORMAS, SERRAS

/* ---------- ambiente ---------- */
const motes = [], blobs = [];

/* =====================================================================
   ATUALIZAÇÃO PRINCIPAL
   ===================================================================== */
function update(dt) {
  simT += dt;
  ambient(dt);
  if (cardT < 6) cardT += dt;
  if (state === 'title') return;
  for (const sw of lv.switches) sw.cd = Math.max(0, sw.cd - dt);
  for (const l of lv.levers) l.ang = approach(l.ang, l.on ? 1 : 0, dt * 5);
  if (state === 'dead') {
    deadT += dt;
    fade = clamp((deadT - 0.3) / 0.5, 0, 1);
    updateBodies(dt); updateMovers(dt); updateButtons(dt); updateSaws(dt);
    camX += (camTarget() - camX) * Math.min(1, dt * 4);
    if (deadT >= 0.9) respawn();
    return;
  }
  if (state === 'end') { endT += dt; return; }
  if (fade > 0) fade = Math.max(0, fade - dt * 1.6);
  if (state === 'play' && whiteA > 0) whiteA = Math.max(0, whiteA - dt * 0.9);
  if (titleA > 0) titleA = Math.max(0, titleA - dt * 0.9);

  let inp = { mx: 0, jd: false, gd: false };
  if (state === 'play') inp = readInput();
  else if (state === 'exit') {
    exitT += dt;
    inp.mx = P.x < lv.endX + 140 ? 1 : 0;
    whiteA = clamp((exitT - 0.3) / 1.8, 0, 1);
    if (exitT > 2.4) {
      if (lvIdx < LEVELS.length - 1) loadLevel(lvIdx + 1, true);
      else { state = 'end'; endT = 0; whiteA = 1; }
      return;
    }
  }
  updateMovers(dt);
  playerStep(dt, inp);
  updateBodies(dt);
  updateButtons(dt);
  updateSaws(dt);
  updateSpider(dt); updateBoss(dt); updateWater(dt); updateRopes(dt); updateLights(dt);

  if (state === 'play') {
    if (lv.spider) spiderKill();
    if (P.drown > 3) die('drown');
    for (let i = cpIdx + 1; i < lv.checkpoints.length; i++) if (P.x >= lv.checkpoints[i].x) cpIdx = i;
    const pr = { x: P.x + 3, y: P.g > 0 ? P.y + 8 : P.y, w: PW - 6, h: P.h - 8 };

    }

  }

  camY += ((lv.camLow && P.y > 520 ? lv.camLow : 0) - camY) * Math.min(1, dt * 2.5);
}

/* =====================================================================

   ===================================================================== */

/* ---------- água ---------- */

  for (let i = 0; i < n; i++) {
    const da = (rnd() - 0.5) * 1.4 + (i === 0 ? -0.35 : 0.35);
    branch(g, x2, y2, ang + da, len * (0.62 + rnd() * 0.2), Math.max(wd * 0.66, 0.8), depth - 1, rnd);
  }
}
function drawDeadTree(g, x, baseY, h, wd, seed) {

}

function limb2(x0, y0, x1, y1, l1, l2, bend) {

      ctx.stroke();
    }
  }
  for (const s of lv.statics) if (s.x < vx1 && s.x + s.w > vx0) { drawStaticExtra(s); drawStaticExtra2(s); }
  if (grassPath) { ctx.strokeStyle = '#000'; ctx.lineWidth = 1.3; ctx.stroke(grassPath); }
  if (th === 'factory') {            // trilhos das serras
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2; ctx.beginPath();
    for (const s of lv.saws) if (s.kind === 'rail') { ctx.moveTo(s.ax - 20, 380.5); ctx.lineTo(s.bx + 20, 380.5); }
    ctx.stroke();
  }
  for (const bt of lv.buttons) {
    const by = bt.pressed ? 378.5 : 376;
    ctx.fillStyle = '#171717'; ctx.fillRect(bt.x + 6, by, bt.w - 12, 380 - by + 1);
    ctx.fillStyle = bt.heavy ? '#8a8a8a' : '#4a4a4a'; ctx.fillRect(bt.x + 6, by, bt.w - 12, 1.4);
    if (bt.heavy) { ctx.fillStyle = '#555'; ctx.fillRect(bt.x, 378, 6, 2); ctx.fillRect(bt.x + bt.w - 6, 378, 6, 2); }
  }
  for (const l of lv.levers) drawLever(l);
  for (const sw of lv.switches) drawSwitch(sw);
  if (lv.log) drawLog(lv.log);
  drawBeamsLight();
  drawMechMid();
  for (const t of lv.traps) if (!t.gone) drawTrap(t);
  for (const b of lv.boxes) if (!b.dead) { drawBox(b); drawBoxExtra(b); }
  drawPlayer();
  drawWaters();
  drawPuddles();

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life) * 0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (th === 'forest') {             // capim alto na frente (esconde a armadilha)
    ctx.strokeStyle = '#000'; ctx.lineCap = 'round';
    for (const t of lv.traps) {
      if (!t.hidden) continue;
      const r = mulberry32(Math.floor(t.hx));
      ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i < 20; i++) {
        const x = t.x - 6 + i * 2.5, h = 10 + r() * 18, l = (r() - 0.5) * 8;
        ctx.moveTo(x, 381); ctx.quadraticCurveTo(x + l * 0.4, 381 - h * 0.6, x + l, 381 - h);
      }
      ctx.stroke();
    }
  }
}

/* =====================================================================
   QUADRO COMPLETO
   ===================================================================== */
function drawGears() {
  ctx.globalAlpha = 0.5;
  for (const g of gears) {
    const sx = mod(g.x - camX * 0.13, 1900) - 250;
    ctx.save(); ctx.translate(sx * S, g.y * S); ctx.rotate(time * g.sp);
    ctx.drawImage(g.spr, -g.spr.width / 2, -g.spr.height / 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawBeams() {

    ctx.fillStyle = 'rgba(255,255,255,0.045)'; ctx.fillRect((x - 14) * S, 0, 28 * S, H);

}

  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);

  const th = lv.theme;
  if (th === 'factory' || th === 'clock') drawGears();
  drawTile(tiles.far, 0.15, 0.6);
  if (th === 'storm') drawWindmills();
  if (th === 'clock') drawPendulums();
  fogBand(250, 500, th === 'forest' ? 0.55 : 0.4);
  drawTile(tiles.mid, 0.4, 0.82);

  ctx.setTransform(S, 0, 0, S, -Math.round(camX * S) + (shk ? (Math.random() - 0.5) * 10 * shk * S : 0), -Math.round(camY * S) + (shk ? (Math.random() - 0.5) * 8 * shk * S : 0));

  ctx.setTransform(1, 0, 0, 1, 0, 0);

  drawTile(tiles.fore, 1.35, 0.93);
  if (th === 'storm') drawStormFx();
  const dense = th === 'forest' ? 1.6 : 1;
  for (const b of blobs) {
    const x = mod(b.x - camX * b.par, 2200) - 500;
    ctx.globalAlpha = Math.min(0.2, b.a * dense);
    ctx.drawImage(blobSprite, x * S, (b.y - b.s * 0.3) * S, b.s * 1.8 * S, b.s * 0.6 * S);
  }
  for (const m of motes) {

    ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(time * 1.3 + m.ph));
    ctx.fillStyle = '#e6e6e6';
    ctx.beginPath(); ctx.arc(x * S, m.y * S, m.r * S, 0, Math.PI * 2); ctx.fill();
  }

  ctx.drawImage(vignetteC, 0, 0);
  if (noiseC) {
    ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
    const pat = ctx.createPattern(noiseC, 'repeat');
    if (pat) {
      ctx.save(); ctx.translate((Math.random() * 128) | 0, (Math.random() * 128) | 0);
      ctx.fillStyle = pat; ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore();
    }

  }

  if (whiteA > 0) { ctx.fillStyle = 'rgba(236,236,236,' + whiteA + ')'; ctx.fillRect(0, 0, W, H); }
  if (fade > 0)   { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(0, 0, W, H); }

}
function drawOverlays() {

      ctx.lineWidth = 1.5 * k;

      ctx.font = (10 * k) + 'px Georgia, serif';

    ctx.globalAlpha = titleA;
    ctx.fillStyle = '#e8e8e8';

    ctx.save(); ctx.shadowColor = 'rgba(255,255,255,0.75)'; ctx.shadowBlur = H * 0.05;
    ctx.font = (H * 0.15) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    spacedText('bad-limbo', W / 2, H * 0.4, H * 0.012);
    ctx.restore();
    ctx.fillStyle = '#b5b5b5';

    ctx.fillText(touchMode

    ctx.globalAlpha = titleA * (0.55 + 0.45 * Math.sin(time * 3));
    ctx.fillStyle = '#fff';
    ctx.fillText(touchMode ? 'toque para começar' : 'pressione qualquer tecla', W / 2, H * 0.72);

  if (state === 'end') drawEndFim();
  if (portrait) {

    ctx.fillStyle = '#ddd'; ctx.textAlign = 'center';
    ctx.font = (W * 0.055) + 'px sans-serif';
    ctx.fillText('Gire o aparelho para o modo paisagem', W / 2, H / 2);
  }
}

function farSwamp(g) {

      g.lineWidth = 8; g.beginPath(); g.arc(x + o + w + 30, 460, 26 + r() * 10, Math.PI, 0); g.stroke();
      g.fillRect(x + o + w + 2, 380, 8, 90); g.fillRect(x + o + w + 52, 380, 8, 90);
    }

}
function midSwamp(g) {
  const r = mulberry32(83);

  g.lineWidth = 1.6; g.lineCap = 'round';
  for (let i = 0; i < 26; i++) {

    g.beginPath(); g.moveTo(x, -5); g.quadraticCurveTo(x + (r() - 0.5) * 12, len * 0.5, x + (r() - 0.5) * 16, len); g.stroke();
  }
}
function foreSwamp(g) {

  for (let x = 0; x < TW; x += 9 + r() * 14) {
    const h = 30 + r() * 70, lean = (r() - 0.5) * 20;
    g.lineWidth = 1.2 + r() * 1.5;

  }
  for (let i = 0; i < 10; i++) {

function farStorm(g) {

  for (let i = 0; i < 8; i++) {
    const x = i * (TW / 8) + r() * 60, w = 50 + r() * 40, h = 300 + r() * 160;
    for (const o of [-TW, 0, TW]) {

function midStorm(g) {

    g.lineWidth = 3; g.beginPath();
    for (let y = 0; y < 500; y += 80) { g.moveTo(x + 14, y); g.lineTo(x + 80, y + 80); g.moveTo(x + 80, y); g.lineTo(x + 14, y + 80); }

function drawWindmills() {

  for (const d of defs) {

    ctx.save(); ctx.scale(S, S);
    ctx.beginPath(); ctx.moveTo(sx - d[1] * 0.14, base); ctx.lineTo(sx - 5, hub); ctx.lineTo(sx + 5, hub); ctx.lineTo(sx + d[1] * 0.14, base); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-d[1] * 0.1, -d[1] * 0.95); ctx.lineTo(d[1] * 0.1, -d[1] * 0.95); ctx.lineTo(3, 0); ctx.fill();
    }

  }

/* ---------- elementos do mundo ---------- */
function drawWeb(x, y, r) {
  ctx.strokeStyle = 'rgba(210,210,210,0.38)'; ctx.lineWidth = 0.8;
  const n = 10; ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = Math.PI * (0.05 + 0.9 * i / (n - 1)) ; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 1.2, y + Math.sin(a) * r * 1.0 - r * 0.2); }
  for (let k = 1; k <= 5; k++) {
    const rr = r * k / 5;
    for (let i = 0; i < n - 1; i++) {
      const a0 = Math.PI * (0.05 + 0.9 * i / (n - 1)), a1 = Math.PI * (0.05 + 0.9 * (i + 1) / (n - 1)), am = (a0 + a1) / 2;
      const p0x = x + Math.cos(a0) * rr * 1.2, p0y = y + Math.sin(a0) * rr - rr * 0.2 * (k / 5);
      const p1x = x + Math.cos(a1) * rr * 1.2, p1y = y + Math.sin(a1) * rr - rr * 0.2 * (k / 5);
      ctx.moveTo(p0x, p0y); ctx.quadraticCurveTo(x + Math.cos(am) * rr * 0.95, y + Math.sin(am) * rr * 0.8 - rr * 0.05, p1x, p1y);
    }
  }
  ctx.stroke();
}
function drawCocoon(x, len, i) {
  const sw = Math.sin(time * 0.8 + i) * 3, cy = len;
  ctx.strokeStyle = 'rgba(200,200,200,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, -20); ctx.lineTo(x + sw, cy - 22); ctx.stroke();
  ctx.fillStyle = '#060606'; ctx.beginPath(); ctx.ellipse(x + sw, cy, 11, 28, sw * 0.02, 0, 6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(190,190,190,0.28)'; ctx.beginPath();
  for (let k = -18; k <= 18; k += 8) { ctx.moveTo(x + sw - 10, cy + k); ctx.quadraticCurveTo(x + sw, cy + k + 5, x + sw + 10, cy + k); }
  ctx.stroke();
}
function drawBackDecor() {
  if (lv.theme === 'lair') {
    for (const w of lv.webs) drawWeb(w.x, w.y, w.r);

}
function drawStaticExtra(s) {

    ctx.moveTo(s.x + 3, s.y + 1); ctx.lineTo(s.x + s.w - 3, s.y + 1);
    ctx.moveTo(s.x + 6, s.y + 14); ctx.lineTo(s.x + s.w - 8, s.y + 17); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(s.x + 6, s.y + s.h / 2, 5, s.h / 2 - 3, 0, 0, 6.3); ctx.stroke();
  } else if (s.root) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.beginPath();
    for (let x = s.x + 4; x < s.x + s.w - 2; x += 9) {
      ctx.moveTo(x, s.y); ctx.quadraticCurveTo(x + ((x * 7) % 9) - 4, s.y + s.h * 0.5, x + ((x * 3) % 7) - 3, s.y + s.h - 1);
    }
    ctx.stroke();
  } else if (s.crev) {
    ctx.strokeStyle = '#242424'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let y = 20; y < s.h; y += 30) { ctx.moveTo(s.x + 4, s.y + y); ctx.lineTo(s.x + 40 + (y % 90), s.y + y + 8); ctx.moveTo(s.x + s.w - 4, s.y + y + 6); ctx.lineTo(s.x + s.w - 60 - (y % 70), s.y + y + 14); }
    ctx.stroke();

}
function drawBlocker(k) {
  if (!k.web) return drawBlockerEx(k);
  if (!k.on) return;
  ctx.strokeStyle = 'rgba(225,225,225,0.55)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let y = 0; y < k.h; y += 9) {

}
function drawFinale() {
  if (!lv.finale) return;
  const lx = lv.endX + 300, ly = 560;
  const k = clamp((P.x - 3300) / (lv.endX - 3300), 0, 1);
  const sx = (lx - camX) * S, sy = (ly - camY) * S, R = (180 + 900 * k * k) * S;

}
function drawEndFim() {
  const a = clamp(endT / 1.6, 0, 1);
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = '#111';
  ctx.font = (H * 0.2) + 'px Georgia, serif';
  ctx.textBaseline = 'alphabetic';
  spacedText('FIM', W / 2, H * 0.315, H * 0.03);
  ctx.font = (H * 0.034) + 'px Georgia, serif'; ctx.fillStyle = '#333';
  const lines = ['b a d - l i m b o', '', 'um jogo de silêncio, luz e sombra', 'feito em HTML, Canvas e Web Audio', '', 'obrigado por atravessar'];
  lines.forEach((t, i) => { if (t) spacedText(t, W / 2, H * (0.435 + i * 0.05), H * 0.004); });
  if (endT > 3.5) {
    const bw = W * 0.26, bh = H * 0.09, bx = W / 2 - bw / 2, by = H * 0.74;
    ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(time * 3));

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('↻  JOGAR NOVAMENTE', W / 2, by + bh / 2); ctx.textBaseline = 'alphabetic';
  }

}

// ---------- Loop principal (passo fixo de 1/120 s) ----------
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.001;
  if (dt > 0.1) dt = 0.1;
  time += dt;
  const portrait = touchMode && cssH > cssW;
  if (!portrait) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  render();
}

resize();
loadLevel(0, false);
state = 'title'; fade = 0; titleA = 1;
requestAnimationFrame(frame);

// gancho de depuração opcional
